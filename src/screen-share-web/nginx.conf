server {
    listen 6000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The API is hosted separately. Keep /api requests on the frontend origin
    # (also used by Discord URL mappings), then forward them to the API host.
    location /api/ {
        resolver 127.0.0.11 valid=60s ipv6=off;
        set $screenshare_api api-screenshare.duckdns.org;

        proxy_pass https://$screenshare_api/;
        proxy_ssl_server_name on;
        proxy_ssl_name $screenshare_api;
        proxy_set_header Host $screenshare_api;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
